name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04 # Fixes the ubuntu-latest migration notice
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # Fixes Node 20 deprecation warning

      - name: Install pnpm
        uses: pnpm/action-setup@v5 # Fixes Node 20 deprecation warning
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5 # Fixes Node 20 deprecation warning
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5 # Fixes setup-java v4 deprecation warning
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor and build web app
        run: |
          pnpm install --no-frozen-lockfile
          # Force install plugins so the build and CLI never fail
          pnpm add @capacitor/core @capacitor/android @capacitor/geolocation @capacitor/local-notifications @capacitor/push-notifications
          pnpm add -D @capacitor/cli
          pnpm run build

      - name: Create native Android project
        run: |
          npx cap init "Atha" "com.atha.marketplace" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Inject Android GPS and Notification Permissions safely
        # Using EOF prevents bash from misinterpreting quotes and backticks (fixes exit code 1)
        run: |
          cat << 'EOF' > inject-perms.js
          const fs = require('fs');
          const file = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(file, 'utf8');
          const perms = `
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-feature android:name="android.hardware.location.gps" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          `;
          xml = xml.replace('</manifest>', perms + '\n</manifest>');
          fs.writeFileSync(file, xml);
          EOF
          node inject-perms.js

      - name: Compile Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Atha-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
