name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 3. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 4. Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 5. Install Web Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 6. Build Web App
        run: pnpm run build

      - name: 7. Install Capacitor Plugins
        run: |
          pnpm add @capacitor/core @capacitor/android @capacitor/geolocation @capacitor/local-notifications @capacitor/push-notifications
          pnpm add -D @capacitor/cli

      - name: 8. Initialize Capacitor
        run: npx cap init "Atha" "com.atha.marketplace" --web-dir dist

      - name: 9. Add Android Platform
        run: npx cap add android

      - name: 10. Inject Permissions
        run: |
          cat << 'EOF' > inject-perms.cjs
          const fs = require('fs');
          const file = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(file, 'utf8');
          if (!xml.includes('android.permission.ACCESS_FINE_LOCATION')) {
            const perms = `
                <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
                <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                <uses-feature android:name="android.hardware.location.gps" />
                <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            `;
            xml = xml.replace('</manifest>', perms + '\n</manifest>');
            fs.writeFileSync(file, xml);
          }
          EOF
          node inject-perms.cjs
          
      - name: 11. Compile Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 12. Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Atha-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
