name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor and build web app
        run: |
          pnpm install --no-frozen-lockfile
          # Ensure plugins are installed in the cloud
          pnpm add @capacitor/core @capacitor/android @capacitor/geolocation @capacitor/local-notifications @capacitor/push-notifications
          pnpm add -D @capacitor/cli
          pnpm run build

      - name: Create native Android project
        run: |
          # Generate capacitor.config and the android folder automatically
          npx cap init "Atha" "com.atha.marketplace" --web-dir dist || true
          npx cap add android || true
          npx cap sync android

      - name: Inject Android GPS and Notification Permissions
        run: |
          cat << 'EOF' > inject-perms.js
          const fs = require('fs');
          const file = 'android/app/src/main/AndroidManifest.xml';
          
          if (fs.existsSync(file)) {
            let xml = fs.readFileSync(file, 'utf8');
            if (!xml.includes('android.permission.ACCESS_FINE_LOCATION')) {
              const perms = `
                  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
                  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                  <uses-feature android:name="android.hardware.location.gps" />
                  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              `;
              xml = xml.replace('</manifest>', perms + '\n</manifest>');
              fs.writeFileSync(file, xml);
            }
          }
          EOF
          node inject-perms.js

      - name: Compile Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Atha-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
