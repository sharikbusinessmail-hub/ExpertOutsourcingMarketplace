name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web app
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Create native Android project
        run: |
          npx cap init "Atha" "com.atha.marketplace" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Inject Android GPS and Notification Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PERMISSIONS='    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          sed -i "/<manifest/a $PERMISSIONS" "$MANIFEST"

      - name: Compile Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Atha-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk